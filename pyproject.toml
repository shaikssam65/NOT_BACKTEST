[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-equity-bot"
version = "0.1.0"
description = "NSE cash-equity bot — universe, AI filter, and backtesting (Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    "yfinance>=0.2.40",
    "openai>=1.40.0",
    "kiteconnect>=5.0.1",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.37.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
trading-bot = "trading_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_bot = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
